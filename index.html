<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tract</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="Free property line maps with parcel owner, acreage and value data from public state records.">
<meta name="theme-color" content="#1d2a2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tract">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3.5 16.5 16.5 3.5l4 4-13 13-4-4Z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.5 9.7l5.9-.8L12 3.5Z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12v7.5h14V12"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><path d="m3.5 11.5 17-8-8 17-2-7-7-2Z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="1.5"/><path d="M15.5 8.5V5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 5v9A1.5 1.5 0 0 0 5 15.5h3.5"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7.5h3.5L9 5h6l1.5 2.5H20v12H4z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8.5 5 4 9.5 8.5 14"/><path d="M4 9.5h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6 9 3.5l6 2.5 5.5-2.5v14.5L15 20.5 9 18l-5.5 2.5Z"/><path d="M9 3.5V18M15 6v14.5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.4"/></symbol>
  </defs>
</svg>

<div id="app">
  <div id="map" role="application" aria-label="Parcel map"></div>

  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button>
    <form class="search" id="searchForm" role="search" autocomplete="off">
      <svg class="search-ic" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="searchInput" type="search" placeholder="Address, owner, parcel ID or lat, lon" aria-label="Search" enterkeyhint="search">
      <button type="button" class="icon-btn small" id="searchClear" aria-label="Clear search" hidden><svg><use href="#i-x"/></svg></button>
    </form>
  </header>
  <div class="suggest" id="suggest" role="listbox" hidden></div>

  <div class="fabs">
    <button class="fab" id="layersBtn" aria-label="Map layers" title="Map layers"><svg><use href="#i-layers"/></svg></button>
    <button class="fab" id="measureBtn" aria-label="Measure" title="Measure distance and area"><svg><use href="#i-ruler"/></svg></button>
    <button class="fab" id="locateBtn" aria-label="Show my location" title="My location"><svg><use href="#i-locate"/></svg></button>
  </div>

  <div class="layers-panel" id="layersPanel" hidden>
    <div class="lp-title">Base map</div>
    <div class="basemaps" id="basemaps"></div>
    <label class="toggle"><input type="checkbox" id="tglLines" checked><span>Property lines</span></label>
    <label class="toggle"><input type="checkbox" id="tglSaved" checked><span>My saved parcels</span></label>
    <label class="toggle"><input type="checkbox" id="tglLabels" checked><span>Road &amp; place labels</span></label>
  </div>

  <div class="hint" id="zoomHint">Zoom in to see property lines</div>
  <div class="coords mono" id="coords" title="Map center"></div>

  <div class="measure-bar" id="measureBar" hidden>
    <div class="mb-read">
      <div class="mb-seg" role="tablist">
        <button data-mode="distance" class="on" role="tab">Distance</button>
        <button data-mode="area" role="tab">Area</button>
      </div>
      <div class="mb-val mono" id="measureVal">Tap the map to start</div>
    </div>
    <div class="mb-actions">
      <button class="chip-btn" id="measureUndo"><svg><use href="#i-undo"/></svg>Undo</button>
      <button class="chip-btn" id="measureClear">Clear</button>
      <button class="chip-btn primary" id="measureDone">Done</button>
    </div>
  </div>

  <section class="sheet" id="sheet" hidden aria-live="polite">
    <div class="sheet-grab" id="sheetGrab" aria-hidden="true"><span></span></div>
    <button class="icon-btn sheet-close" id="sheetClose" aria-label="Close"><svg><use href="#i-x"/></svg></button>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div class="brand"><img src="icons/icon.svg" alt=""><span>Tract</span></div>
      <button class="icon-btn" id="drawerClose" aria-label="Close menu"><svg><use href="#i-x"/></svg></button>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="saved" class="on">Saved</button>
      <button role="tab" data-tab="recent">Recent</button>
      <button role="tab" data-tab="results">Results</button>
      <button role="tab" data-tab="coverage">Coverage</button>
      <button role="tab" data-tab="about">About</button>
    </nav>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="viewer" id="viewer" hidden><img id="viewerImg" alt=""><button class="icon-btn" id="viewerClose" aria-label="Close photo"><svg><use href="#i-x"/></svg></button></div>
  <div class="toast" id="toast" role="status"></div>
  <input type="file" id="photoInput" accept="image/*" multiple hidden>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/proj4.js"></script>
<script src="js/sources.js"></script>
<script src="js/geo.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
